# Firebase Preview Deploy - For Internal Repo PRs
# Deploys to Firebase Preview Channel when PRs are opened/updated
# Content and images are bundled from the internal repo's PR branch

name: Firebase Preview Deploy

on:
  pull_request_target:
    branches: [main, develop, release]

env:
  FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT }}
  VITE_GITHUB_REPO: ${{ github.repository }}
  VITE_GITHUB_BRANCH: ${{ github.head_ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    
    # GitHub Deployment - creates entry in Deployments tab
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
    
    permissions:
      contents: read
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout internal repo (blogs content)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: content

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: Danny213123/program-repo
          token: ${{ secrets.GH_PAT }}
          path: frontend

      - name: Copy blogs content to frontend
        run: |
          # Copy to frontend/blogs only (will copy to public after optimization)
          cp -r ${{ github.workspace }}/content/blogs ${{ github.workspace }}/frontend/blogs
          echo "Copied blogs to frontend/blogs"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Optimize images (WebP, 1080p max)
        working-directory: frontend
        run: npm run optimize-thumbnails
        env:
          BLOGS_DIR: ${{ github.workspace }}/frontend/blogs

      - name: Copy optimized blogs to public
        run: |
          cp -r ${{ github.workspace }}/frontend/blogs ${{ github.workspace }}/frontend/public/blogs
          echo "Copied optimized blogs to frontend/public/blogs"

      - name: Generate blog index
        working-directory: frontend
        run: npm run generate-index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_USE_LOCAL_CONTENT: "true"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Deploy to Firebase Preview Channel
        id: firebase_deploy
        working-directory: frontend
        run: |
          # Deploy and capture output
          OUTPUT=$(firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} \
            --project ${{ env.FIREBASE_PROJECT }} \
            --expires 7d \
            --json 2>&1) || true
          
          echo "=== Firebase CLI Output ==="
          echo "$OUTPUT"
          echo "==========================="
          
          # Method 1: Try to extract URL from JSON output
          PREVIEW_URL=$(echo "$OUTPUT" | jq -r '.result."${{ env.FIREBASE_PROJECT }}".url // empty' 2>/dev/null || echo "")
          echo "Method 1 (JSON): $PREVIEW_URL"
          
          # Method 2: Try alternate JSON path
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$OUTPUT" | jq -r '.result | to_entries | .[0].value.url // empty' 2>/dev/null || echo "")
            echo "Method 2 (JSON entries): $PREVIEW_URL"
          fi
          
          # Method 3: Extract URL using sed (POSIX compatible)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$OUTPUT" | sed -n 's/.*\(https:\/\/[a-zA-Z0-9-]*\.web\.app\).*/\1/p' | head -1)
            echo "Method 3 (sed): $PREVIEW_URL"
          fi
          
          # Method 4: Extract URL using grep -E (extended regex, POSIX compatible)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9-]+\.web\.app' | head -1 || echo "")
            echo "Method 4 (grep -E): $PREVIEW_URL"
          fi
          
          # Final fallback
          if [ -z "$PREVIEW_URL" ]; then
            echo "⚠️ Could not extract preview URL, using fallback"
            PREVIEW_URL="https://${{ env.FIREBASE_PROJECT }}--pr-${{ github.event.pull_request.number }}.web.app"
          fi
          
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "🚀 Final Preview URL: $PREVIEW_URL"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json

      - name: Create preview status with link
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.firebase_deploy.outputs.preview_url }}';
            
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.pull_request.head.sha }}',
              state: 'success',
              target_url: url,
              description: 'Preview ready - click to view',
              context: 'firebase-preview'
            });
